<!DOCTYPE html>
<html>
<head>
<title>Traffic Light</title>
<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f2f2f2;
}

.traffic{
    background:#333;
    width:100px;
    padding:15px;
    border-radius:15px;
}

.light{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#555;
    margin:15px auto;
}

/* active lights */
.red{
    background:red;
}
.yellow{
    background:yellow;
}
.green{
    background:green;
}
</style>
</head>
<body>

<div class="traffic">
    <div class="light red"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
</div>

</body>
</html>
