<!DOCTYPE html>
<html>
<head>
<title>Boxes</title>
<style>
.container{
    display:flex;
    justify-content:center;
    margin-top:50px;
}

.box{
    width:100px;
    height:100px;
    margin:10px;
}

.red{background:red;}
.blue{background:blue;}
.green{background:green;}
</style>
</head>
<body>

<div class="container">
    <div class="box red"></div>
    <div class="box blue"></div>
    <div class="box green"></div>
</div>

</body>
</html>
